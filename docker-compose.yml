# Local Postgres + Redis for HireSignal. Matches the defaults in api/.env.example.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hiresignal
      POSTGRES_HOST_AUTH_METHOD: trust # local dev only
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
